<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重設你的 Fyra 密碼</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="alternate" hreflang="en" href="https://fyra.cc/auth/reset/">
  <link rel="alternate" hreflang="zh-Hans" href="https://fyra.cc/zh-hans/auth/reset/">
  <link rel="alternate" hreflang="zh-Hant" href="https://fyra.cc/zh-hant/auth/reset/">
  <link rel="alternate" hreflang="x-default" href="https://fyra.cc/auth/reset/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f2ede3;
      color: #1a1a1a;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: min(100%, 380px); text-align: center; }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #f5c51824;
      font-size: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #666; line-height: 1.55; margin-bottom: 26px; }
    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 14px;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🔑</div>
    <h1 id="title">重設密碼</h1>
    <p id="message">開啟 Fyra 以設定新密碼。</p>
    <a id="open-app" href="cc.fyra.app://auth-reset">開啟 Fyra</a>
  </main>
  <script>
    const query = window.location.search;
    const hash = window.location.hash;
    const params = new URLSearchParams(query);
    const fragment = new URLSearchParams(hash.replace(/^#/, ""));
    const error = params.get("error_description") || fragment.get("error_description");
    const tokenHash = params.get("token_hash") || fragment.get("token_hash");
    const appURL = "cc.fyra.app://auth-reset" + query + hash;
    const button = document.getElementById("open-app");

    if (error || !tokenHash) {
      document.getElementById("title").textContent = "重設連結已過期";
      document.getElementById("message").textContent =
        error || "此密碼重設連結無效或不完整。請在 Fyra 中申請新的連結。";
      button.textContent = "返回 Fyra";
      button.href = "cc.fyra.app://";
    } else {
      button.href = appURL;
      setTimeout(function () { window.location.href = appURL; }, 600);
    }
  </script>
</body>
</html>
