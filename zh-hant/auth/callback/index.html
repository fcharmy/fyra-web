<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fyra — 電子郵件已確認</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="alternate" hreflang="en" href="https://fyra.cc/auth/callback/">
  <link rel="alternate" hreflang="zh-Hans" href="https://fyra.cc/zh-hans/auth/callback/">
  <link rel="alternate" hreflang="zh-Hant" href="https://fyra.cc/zh-hant/auth/callback/">
  <link rel="alternate" hreflang="x-default" href="https://fyra.cc/auth/callback/">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #F2EDE3;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    .icon.success { background: #f5c518; }
    .icon.error   { background: #fee2e2; }
    .icon.plain   { background: #e5e0d6; }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 0.5rem;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn.secondary {
      background: transparent;
      color: #1a1a1a;
      border: 1.5px solid #ccc;
      margin-top: 0.75rem;
      display: block;
    }
    .countdown {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon success" id="icon">✓</div>
    <h1 id="title">電子郵件已確認</h1>
    <p id="msg">你的 Fyra 帳戶已準備就緒。<br>正在開啟應用程式…</p>
    <a class="btn" id="openBtn" href="#">開啟 Fyra</a>
    <p class="countdown" id="countdown"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const hash = window.location.hash;

    const code = params.get("code");
    const accessToken = hash.includes("access_token=");
    const error = params.get("error");
    const errorDesc = params.get("error_description");
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    const icon = document.getElementById("icon");
    const title = document.getElementById("title");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("openBtn");
    const countdown = document.getElementById("countdown");

    if (error) {
      icon.className = "icon error";
      icon.textContent = "✕";
      title.textContent = "連結已過期";
      msg.textContent = errorDesc
        ? decodeURIComponent(errorDesc.replace(/\+/g, " "))
        : "此確認連結已失效。請重新註冊或申請新的連結。";
      btn.textContent = isMobile ? "返回 Fyra" : "Fyra.cc";
      btn.href = isMobile ? "cc.fyra.app://" : "https://fyra.cc";
    } else if (code || accessToken) {
      if (isMobile) {
        const appUrl = "cc.fyra.app://auth-callback" + window.location.search + hash;
        btn.href = appUrl;
        let secs = 3;
        countdown.textContent = secs + " 秒後跳轉…";
        const timer = setInterval(function () {
          secs--;
          if (secs <= 0) {
            clearInterval(timer);
            countdown.textContent = "";
            window.location.href = appUrl;
          } else {
            countdown.textContent = secs + " 秒後跳轉…";
          }
        }, 1000);
      } else {
        msg.innerHTML = "請在手機上開啟 Fyra 並登入。";
        btn.textContent = "Fyra.cc";
        btn.href = "https://fyra.cc";
      }
    } else {
      icon.className = "icon plain";
      icon.textContent = "↓";
      title.textContent = "下載 Fyra";
      msg.textContent = "追蹤你通往財務自由的道路。";
      btn.textContent = "App Store";
      btn.href = "https://apps.apple.com";
    }
  </script>
</body>
</html>
