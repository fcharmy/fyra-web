<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fyra — 額外 AI 使用次數</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="alternate" hreflang="en" href="https://fyra.cc/refer/">
  <link rel="alternate" hreflang="zh-Hans" href="https://fyra.cc/zh-hans/refer/">
  <link rel="alternate" hreflang="zh-Hant" href="https://fyra.cc/zh-hant/refer/">
  <link rel="alternate" hreflang="x-default" href="https://fyra.cc/refer/">
  <meta name="description" content="你已獲得 Fyra（FIRE 追蹤工具）的額外 AI 使用次數。">
  <meta property="og:title" content="你在 Fyra 獲得了額外 AI 使用次數">
  <meta property="og:description" content="開啟 Fyra 領取你的免費 AI 使用次數，加速你的 FIRE 旅程。">
  <meta property="og:image" content="https://fyra.cc/icons/Fyra-Icon-app-dark-1024.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F2EDE3;
      --gold: #f5c518;
      --amethyst: #b48dd6;
      --dark: #1a1a1a;
      --mid: #555;
      --muted: #888;
      --border: #ddd8ce;
      --red: #e05c5c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--cream);
      color: var(--dark);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      align-items: center;
      padding: 1.25rem 1.5rem;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--dark);
    }
    .wordmark img {
      height: 28px;
      width: 28px;
      border-radius: 6px;
    }
    .wordmark span {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    /* ── Icon states ── */
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    .icon-wrap.gift     { background: #f5c51822; }
    .icon-wrap.referral { background: #b48dd622; }
    .icon-wrap.error    { background: #e05c5c18; }
    .icon-wrap.loading  { background: #88888818; }

    /* ── Text ── */
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.95rem;
      color: var(--mid);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .count-badge {
      display: inline-block;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--dark);
      margin-bottom: 0.25rem;
    }
    .count-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    /* ── Buttons ── */
    .btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
      margin-bottom: 0.75rem;
    }
    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: transparent;
      color: var(--dark);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s;
    }
    .btn-secondary:hover { border-color: #aaa; }

    /* ── Footer note ── */
    .note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 1.5rem;
      line-height: 1.5;
    }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    /* ── Code chip ── */
    .code-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f4ee;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.75rem 0.55rem 1rem;
      margin-bottom: 1.5rem;
      gap: 0.75rem;
    }
    .code-text {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--dark);
    }
    .code-copy {
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .code-copy:hover { opacity: 0.8; }

    /* ── Hidden ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <nav>
    <a class="wordmark" href="https://fyra.cc/zh-hant/">
      <img src="https://fyra.cc/icons/Fyra-Icon-app-dark-1024.png" alt="Fyra">
      <span>Fyra</span>
    </a>
  </nav>

  <main>
    <!-- Loading -->
    <div class="card" id="state-loading">
      <div class="icon-wrap loading"><div class="spinner"></div></div>
      <p class="subtitle">正在驗證你的代碼…</p>
    </div>

    <!-- Valid referral -->
    <div class="card hidden" id="state-valid-referral">
      <div class="icon-wrap gift">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
          <!-- Box body -->
          <rect x="4" y="16" width="28" height="17" rx="2" fill="#f5c518" opacity="0.85"/>
          <!-- Lid -->
          <rect x="3" y="11" width="30" height="7" rx="2" fill="#f5c518"/>
          <!-- Ribbon vertical -->
          <rect x="15.5" y="11" width="5" height="22" rx="1" fill="#e6a800"/>
          <!-- Ribbon on lid -->
          <rect x="3" y="14" width="30" height="3" rx="1" fill="#e6a800"/>
          <!-- Bow left loop -->
          <path d="M18 11 C14 7 8 7 9 11 C10 14 15 13 18 11Z" fill="#e6a800"/>
          <!-- Bow right loop -->
          <path d="M18 11 C22 7 28 7 27 11 C26 14 21 13 18 11Z" fill="#e6a800"/>
          <!-- Bow knot -->
          <circle cx="18" cy="11" r="2" fill="#f5c518"/>
        </svg>
      </div>
      <h1>你的朋友邀請你<br>加入 Fyra</h1>
      <p class="subtitle">他們送你 <strong id="referral-count-inline"></strong> 次額外 AI 使用次數作為歡迎禮物。</p>
      <div class="code-row">
        <span class="code-text" id="code-display">—</span>
        <button class="code-copy" id="copy-btn" onclick="copyCode()">複製代碼</button>
      </div>
      <button class="btn-primary" onclick="openApp()">在 Fyra 中開啟</button>
      <a class="btn-secondary" id="store-link-referral" href="#" onclick="copyAndStore(event)">下載 Fyra</a>
      <p class="note">在 Fyra 中開啟即可立即領取。還沒有？免費下載——你的代碼已複製到剪貼簿。</p>
    </div>

    <!-- Invalid / expired / maxed -->
    <div class="card hidden" id="state-invalid">
      <div class="icon-wrap error">✕</div>
      <h1 id="invalid-title">此連結已過期</h1>
      <p class="subtitle" id="invalid-subtitle">此連結已失效。請向你的朋友索取新連結。</p>
      <a class="btn-primary" href="https://fyra.cc/zh-hant/">了解 Fyra</a>
    </div>

    <!-- No code in URL -->
    <div class="card hidden" id="state-nocode">
      <div class="icon-wrap referral">✨</div>
      <h1>與朋友分享<br>Fyra</h1>
      <p class="subtitle">邀請朋友加入 Fyra，你們雙方都能獲得額外的 AI 使用次數。開啟應用程式即可產生你的連結。</p>
      <a class="btn-primary" href="https://fyra.cc/zh-hant/">了解 Fyra</a>
    </div>
  </main>

  <script src="/refer/config.js"></script>
  <script>

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    let resolvedCode = code;

    function show(id) {
      ['state-loading','state-valid-referral','state-invalid','state-nocode']
        .forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
    }

    function copyCode() {
      navigator.clipboard.writeText(resolvedCode).catch(() => {});
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✓ 已複製';
      setTimeout(() => { btn.textContent = '複製代碼'; }, 2000);
    }

    function copyAndStore(e) {
      e.preventDefault();
      navigator.clipboard.writeText(resolvedCode).catch(() => {});
      setTimeout(() => { window.location.href = APP_STORE_URL; }, 300);
    }

    function openApp() {
      const deepLink = `cc.fyra.app://refer?code=${encodeURIComponent(resolvedCode)}`;
      const start = Date.now();
      window.location.href = deepLink;
      setTimeout(() => {
        if (Date.now() - start < 2000 && !document.hidden) {
          navigator.clipboard.writeText(resolvedCode).catch(() => {});
          window.location.href = APP_STORE_URL;
        }
      }, 1500);
    }

    async function checkCoupon(c) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/check_coupon`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ p_code: c })
      });
      if (!res.ok) throw new Error('network');
      return res.json();
    }

    async function init() {
      if (!code) { show('state-nocode'); return; }

      document.getElementById('store-link-referral').href = APP_STORE_URL;

      try {
        const data = await checkCoupon(code);

        if (!data.valid) {
          const titles = {
            invalid_code:    ['此連結無效', '此代碼不存在。'],
            expired:         ['此連結已過期', '此代碼已失效。'],
            max_uses_reached:['此連結已無法使用', '此代碼的所有使用次數已被領取。']
          };
          const [title, subtitle] = titles[data.error] || ['此連結無效', '發生錯誤。'];
          document.getElementById('invalid-title').textContent = title;
          document.getElementById('invalid-subtitle').textContent = subtitle;
          show('state-invalid');
          return;
        }

        document.getElementById('referral-count-inline').textContent = data.bonus_invocations;
        document.getElementById('code-display').textContent = resolvedCode;
        show('state-valid-referral');

      } catch {
        document.getElementById('referral-count-inline').textContent = '?';
        document.getElementById('code-display').textContent = resolvedCode;
        show('state-valid-referral');
      }
    }

    init();
  </script>
</body>
</html>
