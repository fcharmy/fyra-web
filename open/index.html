<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="apple-itunes-app" content="app-id=6792294546, app-argument=cc.fyra.app://quick/aiAssistant"><title>Open Fyra</title><link rel="icon" href="/favicon-32.png">
<style>*{box-sizing:border-box}body{margin:0;background:#f4f3ee;color:#292a25;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:100%;max-width:460px;background:white;padding:38px 30px;border-radius:20px}.brand{font-weight:700;letter-spacing:4px;color:#927829;font-size:18px}h1{font-size:30px;line-height:1.35;margin:25px 0 16px}p{line-height:1.7;color:#737568}a{color:#78621f}.button{display:block;text-align:center;background:#dfbc4b;color:#24251f;padding:16px;border-radius:10px;text-decoration:none;font-weight:600;margin:26px 0 16px}.download{display:block;text-align:center;font-size:14px}.help,footer{font-size:12px;margin-top:24px}footer{text-align:center}</style></head>
<body><main><div class="brand">FYRA</div><h1 data-copy="heading">Your next step starts here.</h1><p data-copy="body">Open AI Assistant to import a screenshot, log a transaction, or explore your FIRE progress.</p><a class="button" id="open-app" href="cc.fyra.app://quick/aiAssistant" data-copy="open">Open Fyra</a><a class="download" href="https://apps.apple.com/app/id6792294546" data-copy="download">Get Fyra on the App Store</a><p class="help" data-copy="help">If Fyra does not open, tap the button. In an email browser, you may need to open this page in Safari.</p><footer><a id="privacy" href="/privacy/" data-copy="privacy">Privacy</a> · <a id="terms" href="/terms/" data-copy="terms">Terms</a></footer></main>
<script>
const copy = {"en": {"title": "Open Fyra", "heading": "Your next step starts here.", "body": "Open AI Assistant to import a screenshot, log a transaction, or explore your FIRE progress.", "open": "Open Fyra", "download": "Get Fyra on the App Store", "help": "If Fyra does not open, tap the button. In an email browser, you may need to open this page in Safari.", "privacy": "Privacy", "terms": "Terms"}, "zh-Hans": {"title": "打开 Fyra", "heading": "从这里开始下一步。", "body": "打开 AI 助手，导入截图、记录交易，或了解你的 FIRE 进展。", "open": "打开 Fyra", "download": "在 App Store 下载 Fyra", "help": "如果 Fyra 没有打开，请点击按钮。在邮件内置浏览器中，你可能需要先在 Safari 中打开此页面。", "privacy": "隐私政策", "terms": "服务条款"}, "zh-Hant": {"title": "開啟 Fyra", "heading": "從這裡開始下一步。", "body": "開啟 AI 助手，匯入截圖、記錄交易，或了解你的 FIRE 進展。", "open": "開啟 Fyra", "download": "在 App Store 下載 Fyra", "help": "如果 Fyra 沒有開啟，請點擊按鈕。在郵件內建瀏覽器中，你可能需要先在 Safari 中開啟此頁面。", "privacy": "隱私權政策", "terms": "服務條款"}};
const requested = new URLSearchParams(location.search).get('lang') || navigator.language;
const language = /^zh-(Hant|TW|HK|MO)/i.test(requested) ? 'zh-Hant' : /^zh/i.test(requested) ? 'zh-Hans' : 'en';
document.documentElement.lang = language;
document.title = copy[language].title;
for (const node of document.querySelectorAll('[data-copy]')) node.textContent = copy[language][node.dataset.copy];
const prefix = language === 'en' ? '' : '/' + language.toLowerCase();
document.getElementById('privacy').href = prefix + '/privacy/';
document.getElementById('terms').href = prefix + '/terms/';
// The existing app route opens AI Assistant. The visible button remains when a
// browser blocks automatic scheme navigation; there is no timed Store redirect.
if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  setTimeout(() => { if (!document.hidden) location.href = 'cc.fyra.app://quick/aiAssistant'; }, 250);
}
</script></body></html>
